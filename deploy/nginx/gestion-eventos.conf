# Plantilla para que Tecnología la adapte al dominio y al certificado institucional.
# El bloque TLS debe usar las rutas reales del certificado interno aprobado.
server {
    listen 80;
    server_name eventos.interno.empresa;
    # En producción, redirigir HTTP a HTTPS una vez configurado el certificado:
    # return 301 https://$host$request_uri;
    root /var/www/gestion-eventos;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
